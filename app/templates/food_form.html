{% extends 'base.html' %}
{% block title %}Publicar alimentos · Desperdicio Cero{% endblock %}
{% block content %}
<div class="page-wrap"><section class="page-head"><span class="eyebrow">UNA DONACIÓN EMPIEZA AQUÍ</span><h1>Publicar alimento</h1><p>Comparte los datos necesarios para que la comunidad encuentre y solicite tu publicación.</p></section><form class="panel wide food-form-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Nombre del alimento<input name="name" maxlength="140" placeholder="Ej. Plátanos maduros" required></label><label>Categoría<select name="category" required>{% for category in categories %}<option>{{ category }}</option>{% endfor %}</select></label><label>Cantidad disponible<input name="quantity" type="number" step="0.01" min="0.01" placeholder="0.00" required></label><label>Unidad<select name="unit" required>{% for unit in ['kg','gramos','unidades','litros','paquetes'] %}<option>{{ unit }}</option>{% endfor %}</select></label><label>Disponible desde<input name="available_date" type="date" value="{{ today }}" required></label><label>Disponible hasta<input name="expiry_date" type="date" min="{{ today }}" required></label><label>Provincia<input name="province" maxlength="80" placeholder="Provincia"></label><label>Distrito<input name="district" maxlength="80" placeholder="Distrito"></label><label>Dirección de entrega<input name="address" maxlength="240" placeholder="Punto de recojo o entrega"></label><label>Conservación<input name="storage" maxlength="240" placeholder="Refrigerado, ambiente..."></label></div><label>Descripción<textarea name="description" rows="3" placeholder="Detalles relevantes para quien recibirá el alimento"></textarea></label><div class="actions"><button class="button" type="submit">Publicar alimento <span aria-hidden="true">↗</span></button><a class="button button-outline" href="{{ url_for('main.dashboard') }}">Volver al panel</a></div></form></div>
{% endblock %}
